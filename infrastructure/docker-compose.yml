services:
  postgres:
    image: postgres:16
    container_name: TLT_postgres
    environment:
      POSTGRES_DB: TLT
      POSTGRES_USER: TLT_user_sai
      POSTGRES_PASSWORD: TLT_pass_4_SAI
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: TLT_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data: