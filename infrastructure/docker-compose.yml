services:
  postgres:
    image: postgres:16
    container_name: TLT_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: TLT_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  webhook-server:
    build: ../backend/webhook-server
    container_name: TLT_webhook
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: development
    ports:
      - "3001:3001"
    restart: unless-stopped
    depends_on:
      - postgres
      - redis

  api-server:
    build: ../backend/api-server
    container_name: TLT_api
    environment:
      PORT: 3002
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: development
    ports:
      - "3002:3002"
    restart: unless-stopped
    depends_on:
      - postgres
      - redis

  workers:
    build: ../backend/workers
    container_name: TLT_workers
    environment:
      PORT: 3003
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: development
    ports:
      - "3003:3003"
    restart: unless-stopped
    depends_on:
      - postgres
      - redis

  parser:
    build: ../parser
    container_name: TLT_parser
    environment:
      PORT: 8000
      NODE_ENV: development
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    container_name: TLT_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    restart: unless-stopped
    depends_on:
      - api-server
      - webhook-server
      - parser
      - workers

volumes:
  postgres_data:














