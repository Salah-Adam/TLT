events {
    worker_connections 1024;
}

http {
    upstream api_server {
        server api-server:3002;
    }

    upstream webhook_server {
        server webhook-server:3001;
    }

    upstream parser {
        server parser:8000;
    }

    upstream workers {
        server workers:3003;
    }

    server {
        listen 80;

        location /api/ {
            proxy_pass http://api_server/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /webhooks/ {
            proxy_pass http://webhook_server/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /parse/ {
            proxy_pass http://parser/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /health {
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }
    }
}